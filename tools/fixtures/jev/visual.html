<!doctype html><meta charset="utf-8"><title>Visual decision test</title><style>body{font:24px system-ui;margin:60px}button{font:inherit;background:#eee;border:2px solid #333;padding:25px;margin:25px}button::before{content:'';display:block;width:100px;height:100px;border-radius:50%;margin-bottom:20px}button:nth-of-type(1)::before{background:#db3131}button:nth-of-type(2)::before{background:#199b43}#result{padding:20px}</style><h1>Visual decision test</h1><p>Choose the requested circle.</p><button id="a">Choose</button><button id="b">Choose</button><div id="result" role="status">No selection yet.</div><script>document.getElementById('a').addEventListener('click',()=>document.getElementById('result').textContent='Selected red circle');document.getElementById('b').addEventListener('click',()=>document.getElementById('result').textContent='Selected green circle');</script>
