<!doctype html><meta charset="utf-8"><title>Browser Agent decision test</title><style>body{font:22px system-ui;margin:60px;max-width:850px}input,button{font:inherit;padding:16px;margin:12px}#result{margin:20px;padding:20px;background:#eee}</style><h1>Local decision test</h1><p>This test stays on this local page. Nothing is submitted to a server.</p><label for="name">Test name</label><input id="name" autocomplete="off"><button id="save">Save test name</button><div id="result" role="status">No name saved yet.</div><script>document.getElementById('save').addEventListener('click',()=>{document.getElementById('result').textContent='Saved test name: '+document.getElementById('name').value;});</script>
